wazuh:
  # Wazuh Manager Linux default:
  alerts_path: /var/ossec/logs/alerts/alerts.json
  min_rule_level: 10
  limit: 10

llm:
  # OpenAI-compatible endpoint. If api_key is omitted, PoC uses offline heuristic analyzer.
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini
  api_key: ""

policy:
  require_human_approval: true
  min_confidence_for_defense: 0.70
  allow_defense_for_risk_levels: [high, critical]
  allowed_action_types:
    - notify_admin
    - create_incident
    - block_ip
    - quarantine_file
    - kill_process
    - disable_account
  # Safer default: do not block RFC1918/loopback/private IPs in PoC.
  allow_private_ip_block: false

approval:
  # safe modes: file, interactive. Lab-only mode: auto_approve_for_lab_only
  mode: file
  file: /tmp/wazuh-llm-poc/APPROVE

runtime:
  dry_run: true
  incident_log: /tmp/wazuh-llm-poc/incidents.jsonl
  # Linux example. Keep dry_run=true until tested.
  block_ip_command: "sudo iptables -A INPUT -s {target} -j DROP"
